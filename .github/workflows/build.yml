name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 프로젝트 위치 찾기
        run: echo "PROJ=$(dirname "$(find . -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV
      - name: 단위 테스트
        run: cd "$PROJ" && gradle testDebugUnitTest --no-daemon
      - name: APK 빌드
        run: cd "$PROJ" && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: worklife-apk
          path: "**/app/build/outputs/apk/release/*.apk"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: "**/app/build/reports/tests"
