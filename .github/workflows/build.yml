name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # 릴리즈 생성용

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 준비
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4   # Gradle·의존성 캐시
        with:
          gradle-version: "8.9"
      - name: 프로젝트 위치 찾기 (폴더째 올려도 동작)
        run: echo "PROJ=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")" >> $GITHUB_ENV
      - name: APK 빌드 (실패 시 에러를 요약에 표시)
        run: |
          cd "$PROJ"
          set -o pipefail
          if ! gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon 2>&1 | tee build.log; then
            { echo "## ❌ 빌드 에러"; echo '```'; grep -E "^e: |error:|What went wrong" -A4 build.log | head -100; echo '```'; } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - name: 단위 테스트
        run: |
          cd "$PROJ"
          set -o pipefail
          if ! gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log; then
            { echo "## ❌ 테스트 실패"; echo '```'; grep -E "FAILED|AssertionError|^e: " -A3 test.log | head -100; echo '```'; } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - name: APK 이름 정리
        run: cp "$PROJ"/app/build/outputs/apk/release/*.apk worklife-${{ github.run_number }}.apk
      - name: 릴리즈 만들기 (앱이 이걸 보고 업데이트)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || '수동 빌드' }}
          files: worklife-${{ github.run_number }}.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: worklife-apk
          path: worklife-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: "**/app/build/reports/tests"
